// ===== Auth =====
function handleLogin(e){
  e.preventDefault();
  const u = document.getElementById('loginUser').value.trim();
  const p = document.getElementById('loginPass').value.trim();
  if(u === 'admin' && p === 'admin123'){
    sessionStorage.setItem('admin_logged_in','1');
    showApp();
  } else {
    document.getElementById('loginError').textContent = '账号或密码错误';
  }
}
function handleLogout(){
  sessionStorage.removeItem('admin_logged_in');
  document.getElementById('app').classList.remove('active');
  document.getElementById('loginPage').style.display = 'flex';
}
function showApp(){
  document.getElementById('loginPage').style.display = 'none';
  document.getElementById('app').classList.add('active');
  switchPage('competitions');
  updateTime();
  setInterval(updateTime, 1000);
}
function updateTime(){
  const now = new Date();
  document.getElementById('currentTime').textContent = now.toLocaleString('zh-CN');
}

// ===== Navigation =====
function switchPage(page){
  state.currentPage = page;
  state.pagination.page = 1;
  state.filters = { search: '', status: '', group: '', region: '' };
  
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  document.querySelector(`[data-page="${page}"]`)?.classList.add('active');
  
  const titles = { competitions: '赛事发布', submissions: '作品提交管理', judges: '评委设置', reviews: '作品评审' };
  document.getElementById('pageTitle').textContent = titles[page];
  
  const renderers = { competitions: renderCompetitions, submissions: renderSubmissions, judges: renderJudges, reviews: renderReviews };
  renderers[page]();
  
  updateCounts();
}

function updateCounts(){
  const pending = state.submissions.filter(s => s.status === 'pending').length;
  document.getElementById('subCount').textContent = pending;
}

// ===== Utility =====
function genId(prefix){
  return prefix + Date.now().toString(36).toUpperCase() + Math.random().toString(36).substr(2,3).toUpperCase();
}
function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str || '';
  return div.innerHTML;
}
function statusTag(status){
  const map = {
    ongoing: ['进行中','tag-success'],
    ended: ['已结束','tag-default'],
    pending: ['待评审','tag-warning'],
    reviewing: ['评审中','tag-info'],
    scored: ['已评分','tag-success'],
    active: ['在职','tag-success'],
    inactive: ['停用','tag-default']
  };
  const [text, cls] = map[status] || [status, 'tag-default'];
  return `<span class="tag ${cls}">${text}</span>`;
}

// ===== Modal =====
function openModal(title, bodyHtml, footerHtml){
  document.getElementById('modalTitle').textContent = title;
  document.getElementById('modalBody').innerHTML = bodyHtml;
  document.getElementById('modalFooter').innerHTML = footerHtml;
  document.getElementById('modalOverlay').classList.add('show');
}
function closeModal(){
  document.getElementById('modalOverlay').classList.remove('show');
}
function confirmDialog(title, message, onConfirm){
  const body = `<div class="confirm-box">
    <div class="icon">!</div>
    <h4>${title}</h4>
    <p>${message}</p>
  </div>`;
  const footer = `
    <button class="btn btn-secondary" onclick="closeModal()">取消</button>
    <button class="btn btn-danger" id="confirmBtn">确认删除</button>
  `;
  openModal('确认操作', body, footer);
  setTimeout(() => {
    document.getElementById('confirmBtn').onclick = () => { closeModal(); onConfirm(); };
  }, 10);
}

function saveCompetition(id){
  const form = document.getElementById('compForm');
  const fd = new FormData(form);
  
  const groups = fd.getAll('groups');
  const regions = fd.getAll('regions');
  const topics = fd.getAll('topics');
  
  if(!fd.get('name') || !fd.get('code') || !fd.get('signEnd')){
    alert('请填写必填项');
    return;
  }
  if(groups.length === 0){ alert('请至少选择一个竞赛组别'); return; }
  if(regions.length === 0){ alert('请至少选择一个赛区'); return; }
  
  const data = {
    name: fd.get('name'),
    code: fd.get('code'),
    status: fd.get('status'),
    organizer: fd.get('organizer'),
    groups, regions, topics,
    signStart: fd.get('signStart'),
    signEnd: fd.get('signEnd'),
    submitEnd: fd.get('submitEnd'),
    finalDate: fd.get('finalDate'),
    location: fd.get('location'),
    description: fd.get('description')
  };
  
  if(id){
    const idx = state.competitions.findIndex(c => c.id === id);
    if(idx > -1) state.competitions[idx] = { ...state.competitions[idx], ...data };
  } else {
    state.competitions.unshift({
      id: genId('C'),
      ...data,
      createdAt: new Date().toISOString().split('T')[0]
    });
  }
  
  closeModal();
  renderCompetitions();
}

function saveSubmission(id){

  const data = Object.fromEntries(fd.entries());
  
  if(id){

    if(idx > -1) state.submissions[idx] = { ...state.submissions[idx], ...data };
  } else {
    state.submissions.unshift({
      id: genId('W'),
      ...data,
      score: null,
      submittedAt: new Date().toLocaleString('zh-CN', { hour12: false }).replace(/\//g,'-')
    });

  closeModal();
  renderSubmissions();
  updateCounts();
}

function renderReviews(){
  const { search, status } = state.filters;
  const { page, pageSize } = state.pagination;
  
  // 展示所有作品 + 评审状态
  let list = state.submissions.map(s => {
    const reviews = state.reviews.filter(r => r.submissionId === s.id);
    const avgScore = reviews.length > 0
      ? (reviews.reduce((sum,r) => sum + r.total, 0) / reviews.length).toFixed(1)
      : null;
    return { ...s, reviewCount: reviews.length, avgScore };
  });
  
  if(search){
    const s = search.toLowerCase();
    list = list.filter(w => w.title.toLowerCase().includes(s) || w.school.toLowerCase().includes(s));
  }
  if(status){
    if(status === 'pending') list = list.filter(w => w.reviewCount === 0);
    else if(status === 'partial') list = list.filter(w => w.reviewCount > 0 && w.reviewCount < 3);
    else if(status === 'done') list = list.filter(w => w.reviewCount >= 3);
  }
  
  const total = list.length;
  const totalPages = Math.max(1, Math.ceil(total / pageSize));
  const pageData = list.slice((page-1)*pageSize, page*pageSize);
  
  const html = `
    <div class="card">
      <div class="card-header">
        <h3>作品评审</h3>
      </div>
      <div style="padding:16px 24px 0;display:flex;gap:12px;flex-wrap:wrap;align-items:center">
        <input type="text" placeholder="搜索作品/院校" value="${escapeHtml(search)}" oninput="state.filters.search=this.value;state.pagination.page=1;renderReviews()" style="height:36px;padding:0 12px;border:1px solid var(--border);border-radius:8px;font-size:13px;width:240px">
        <select onchange="state.filters.status=this.value;state.pagination.page=1;renderReviews()" style="height:36px;padding:0 12px;border:1px solid var(--border);border-radius:8px;font-size:13px">
          <option value="">全部状态</option>
          <option value="pending" ${status==='pending'?'selected':''}>未评审</option>
          <option value="partial" ${status==='partial'?'selected':''}>评审中</option>
          <option value="done" ${status==='done'?'selected':''}>评审完成</option>
        </select>
        <div style="flex:1"></div>
        <button class="btn btn-primary" onclick="showReviewForm()">+ 新增评分</button>
      </div>
      <div class="table-wrap" style="margin-top:16px">
        <table>
          <thead>
            <tr>
              <th>作品</th>
              <th>组别/赛区</th>
              <th>院校</th>
              <th>命题方向</th>
              <th>评审进度</th>
              <th>平均分</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody>
            ${pageData.map(w => {
              const progress = w.reviewCount >= 3 ? 'done' : w.reviewCount > 0 ? 'partial' : 'pending';
              const progressText = progress === 'done' ? '评审完成' : progress === 'partial' ? '评审中' : '未评审';
              const progressCls = progress === 'done' ? 'tag-success' : progress === 'partial' ? 'tag-info' : 'tag-warning';
              return `
              <tr>
                <td style="font-weight:500">
                  ${escapeHtml(w.title)}<br>
                  <span style="color:var(--text-secondary);font-size:12px;font-weight:400">${w.id}</span>
                </td>
                <td>${w.group}<br><span style="color:var(--text-secondary);font-size:12px">${w.region}</span></td>
                <td>${escapeHtml(w.school)}</td>
                <td><span class="tag tag-info">${escapeHtml(w.topic)}</span></td>
                <td>
                  <span class="tag ${progressCls}">${progressText}</span>
                  <div style="margin-top:6px;background:var(--border-light);height:4px;border-radius:4px;overflow:hidden;width:100px">
                    <div style="height:100%;background:var(--primary);width:${Math.min(w.reviewCount/3*100, 100)}%"></div>
                  </div>
                  <span style="font-size:11px;color:var(--text-muted)">${w.reviewCount}/3 位评委</span>
                </td>
                <td style="font-weight:700;font-size:16px;color:${w.avgScore?'var(--primary)':'var(--text-muted)'}">${w.avgScore || '-'}</td>
                <td>
                  <div class="td-actions">
                    <button class="btn btn-secondary btn-sm" onclick="viewReviews('${w.id}')">查看评审</button>
                    <button class="btn btn-primary btn-sm" onclick="showReviewForm('${w.id}')">打分</button>
                  </div>
                </td>
              </tr>
            `;}).join('')}
            ${pageData.length === 0 ? `<tr><td colspan="7" style="text-align:center;padding:40px;color:var(--text-muted)">暂无数据</td></tr>` : ''}
          </tbody>
        </table>
      </div>
      ${renderPagination(total, totalPages, 'renderReviews')}
    </div>
  `;
  document.getElementById('pageContent').innerHTML = html;
}

function showReviewForm(submissionId){
  const work = submissionId ? state.submissions.find(s => s.id === submissionId) : null;
  const activeJudges = state.judges.filter(j => j.status === 'active');
  
  const workOptions = state.submissions.map(s => 
    `<option value="${s.id}" ${submissionId===s.id?'selected':''}>${s.id} - ${escapeHtml(s.title)}</option>`
  ).join('');
  
  const judgeOptions = activeJudges.map(j => 
    `<option value="${j.id}">${escapeHtml(j.name)}（${escapeHtml(j.org)}）</option>`
  ).join('');
  
  const body = `
    <form id="reviewForm" class="form-grid">
      <div class="form-group">
        <label>选择作品 <span class="req">*</span></label>
        <select name="submissionId" id="reviewWorkSelect" required>${workOptions}</select>
      </div>
      <div class="form-group">
        <label>评审评委 <span class="req">*</span></label>
        <select name="judgeId" required>${judgeOptions}</select>
      </div>
      
      <div class="form-group full" style="margin-top:8px">
        <div style="background:var(--surface-2);border-radius:8px;padding:14px 16px">
          <div style="font-weight:600;margin-bottom:8px">评分维度</div>
          ${SCORE_DIMENSIONS.map(d => `
            <div class="score-item">
              <div class="dim-name">
                ${d.name}
                <small>${d.desc}</small>
              </div>
              <div class="score-input">
                <input type="number" name="${d.key}" min="0" max="${d.max}" step="0.5" value="0" oninput="updateTotalScore()">
              </div>
              <div class="max-score">/ ${d.max}</div>
            </div>
          `).join('')}
          <div class="score-item" style="border-top:2px solid var(--primary);padding-top:14px;margin-top:8px">
            <div class="dim-name" style="font-weight:700;font-size:15px">总分</div>
            <div class="score-input">
              <input type="text" id="totalScoreDisplay" value="0" readonly style="background:var(--primary);color:#fff;font-weight:700;border-color:var(--primary)">
            </div>
            <div class="max-score">/ 100</div>
          </div>
        </div>
      </div>
      
      <div class="form-group full">
        <label>评审意见</label>
        <textarea name="comment" rows="3" placeholder="请输入评审意见..."></textarea>
      </div>
    </form>
  `;
  
  const footer = `
    <button class="btn btn-secondary" onclick="closeModal()">取消</button>
    <button class="btn btn-primary" onclick="saveReview()">提交评分</button>
  `;
  
  openModal('作品评分', body, footer);
  setTimeout(updateTotalScore, 10);
}

function updateTotalScore(){
  let total = 0;
  SCORE_DIMENSIONS.forEach(d => {
    const input = document.querySelector(`[name="${d.key}"]`);
    if(input) total += parseFloat(input.value) || 0;
  });
  const display = document.getElementById('totalScoreDisplay');
  if(display) display.value = total.toFixed(1);
}

function saveReview(){
  const form = document.getElementById('reviewForm');
  const fd = new FormData(form);
  
  const submissionId = fd.get('submissionId');
  const judgeId = fd.get('judgeId');
  const judge = state.judges.find(j => j.id === judgeId);
  
  const designScore = parseFloat(fd.get('designScore')) || 0;
  const aigcScore = parseFloat(fd.get('aigcScore')) || 0;
  const presentationScore = parseFloat(fd.get('presentationScore')) || 0;
  const total = designScore + aigcScore + presentationScore;
  
  if(!submissionId || !judgeId){ alert('请选择作品和评委'); return; }
  if(total <= 0){ alert('请填写评分'); return; }
  
  // 检查是否已存在该评委对该作品的评分
  const existingIdx = state.reviews.findIndex(r => r.submissionId === submissionId && r.judgeId === judgeId);
  
  const reviewData = {
    submissionId,
    judgeId,
    judgeName: judge?.name || '',
    designScore,
    aigcScore,
    presentationScore,
    total,
    comment: fd.get('comment') || '',
    reviewedAt: new Date().toLocaleString('zh-CN', { hour12: false }).replace(/\//g,'-')
  };
  
  if(existingIdx > -1){
    state.reviews[existingIdx] = { ...state.reviews[existingIdx], ...reviewData };
  } else {
    state.reviews.unshift({ id: genId('R'), ...reviewData });
  }
  
  // 更新作品状态和分数
  const sub = state.submissions.find(s => s.id === submissionId);
  if(sub){
    const allReviews = state.reviews.filter(r => r.submissionId === submissionId);
    if(allReviews.length > 0){
      sub.status = allReviews.length >= 3 ? 'scored' : 'reviewing';
      sub.score = (allReviews.reduce((s,r) => s + r.total, 0) / allReviews.length).toFixed(1) * 1;
    }
  }
  
  closeModal();
  renderReviews();
  updateCounts();
}

function viewReviews(submissionId){
  const work = state.submissions.find(s => s.id === submissionId);
  if(!work) return;
  
  const reviews = state.reviews.filter(r => r.submissionId === submissionId);
  const avgScore = reviews.length > 0
    ? (reviews.reduce((s,r) => s + r.total, 0) / reviews.length).toFixed(1)
    : null;
  
  const body = `
    <div style="margin-bottom:20px">
      <h3 style="font-size:16px;margin-bottom:8px">${escapeHtml(work.title)}</h3>
      <p style="color:var(--text-secondary);font-size:13px">${escapeHtml(work.school)} · ${work.group} · ${work.region}</p>
    </div>
    
    <div class="score-summary">
      <div class="score-card">
        <div class="num">${reviews.length}</div>
        <div class="lbl">已评审评委数</div>
      </div>
      <div class="score-card">
        <div class="num">${avgScore || '-'}</div>
        <div class="lbl">当前平均分</div>
      </div>
      <div class="score-card">
        <div class="num">${work.status === 'scored' ? '已完成' : work.status === 'reviewing' ? '进行中' : '未开始'}</div>
        <div class="lbl">评审状态</div>
      </div>
    </div>
    
    <div style="margin-top:24px">
      <h4 style="font-size:14px;margin-bottom:12px">评审详情</h4>
      ${reviews.length === 0 ? `<p style="color:var(--text-muted);text-align:center;padding:30px">暂无评审记录</p>` : 
        reviews.map((r, i) => `
          <div style="border:1px solid var(--border-light);border-radius:8px;padding:16px;margin-bottom:12px">
            <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
              <div class="cell-avatar">
                <div class="avatar">${r.judgeName.charAt(0)}</div>
                <div class="info">
                  <div class="name">${escapeHtml(r.judgeName)}</div>
                  <div class="sub">${r.reviewedAt}</div>
                </div>
              </div>
              <div style="font-size:24px;font-weight:700;color:var(--primary)">${r.total.toFixed(1)}</div>
            </div>
            <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px">
              ${SCORE_DIMENSIONS.map(d => `
                <div style="background:var(--surface-2);border-radius:6px;padding:8px 10px;text-align:center">
                  <div style="font-size:15px;font-weight:600;color:var(--primary)">${r[d.key]}</div>
                  <div style="font-size:11px;color:var(--text-secondary)">${d.name}</div>
                </div>
              `).join('')}
            </div>
            ${r.comment ? `<div style="font-size:13px;color:var(--text-secondary);padding-top:10px;border-top:1px solid var(--border-light)">💬 ${escapeHtml(r.comment)}</div>` : ''}
            <div style="text-align:right;margin-top:10px">
              <button class="btn btn-danger btn-sm" onclick="deleteReview('${r.id}','${submissionId}')">删除该评审</button>
            </div>
          </div>
        `).join('')
      }
    </div>
  `;
  
  const footer = `
    <button class="btn btn-secondary" onclick="closeModal()">关闭</button>
    <button class="btn btn-primary" onclick="closeModal();showReviewForm('${submissionId}')">继续评分</button>
  `;
  
  openModal('评审详情', body, footer);
}

function deleteReview(reviewId, submissionId){
  confirmDialog('删除评审', '确定要删除该评审记录吗？', () => {
    state.reviews = state.reviews.filter(r => r.id !== reviewId);
    // 更新作品状态
    const sub = state.submissions.find(s => s.id === submissionId);
    if(sub){
      const remaining = state.reviews.filter(r => r.submissionId === submissionId);
      if(remaining.length === 0){
        sub.status = 'pending';
        sub.score = null;
      } else {
        sub.status = remaining.length >= 3 ? 'scored' : 'reviewing';
        sub.score = (remaining.reduce((s,r) => s + r.total, 0) / remaining.length).toFixed(1) * 1;
      }
    }
    closeModal();
    renderReviews();
    updateCounts();
  });
}

// ===== Pagination =====
function renderPagination(total, totalPages, renderFn){
  const { page } = state.pagination;
  let pages = [];
  for(let i = 1; i <= totalPages; i++){
    if(i === 1 || i === totalPages || (i >= page-1 && i <= page+1)){
      pages.push(i);
    } else if(pages[pages.length-1] !== '...'){
      pages.push('...');
    }
  }
  
  return `
    <div class="pagination">
      <span>共 <strong>${total}</strong> 条记录</span>
      <div class="page-btns">
        <button class="page-btn" ${page<=1?'disabled style="opacity:.5;cursor:not-allowed"':''} onclick="state.pagination.page=Math.max(1,state.pagination.page-1);${renderFn}()">‹</button>
        ${pages.map(p => p === '...' 
          ? `<span style="padding:0 4px;color:var(--text-muted)">...</span>`
          : `<button class="page-btn ${p===page?'active':''}" onclick="state.pagination.page=${p};${renderFn}()">${p}</button>`
        ).join('')}
        <button class="page-btn" ${page>=totalPages?'disabled style="opacity:.5;cursor:not-allowed"':''} onclick="state.pagination.page=Math.min(${totalPages},state.pagination.page+1);${renderFn}()">›</button>
      </div>
    </div>
  `;
}

// ===== Init =====
window.onload = function(){
  if(sessionStorage.getItem('admin_logged_in') === '1'){
    showApp();
  }
};
</script>
