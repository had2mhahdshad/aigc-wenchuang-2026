<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">

<title>赛事管理后台 | AIGC文创设计赛项</title>
<style>

*{margin:0;padding:0;box-sizing:border-box}
:root{
  --primary:#b83325;--primary-dark:#8b241a;--primary-light:#d94b3a;
  --accent:#c8961e;--accent-dark:#a07710;
  --bg:#f5f6f8;--surface:#fff;--surface-2:#fafbfc;
  --text:#1a1a1a;--text-secondary:#6b7280;--text-muted:#9ca3af;
  --border:#e5e7eb;--border-light:#f0f1f3;
  --success:#10b981;--warning:#f59e0b;--danger:#ef4444;--info:#3b82f6;
  --shadow-sm:0 1px 2px rgba(0,0,0,.04);--shadow:0 4px 12px rgba(0,0,0,.06);
  --shadow-lg:0 10px 30px rgba(0,0,0,.1);
  --radius:8px;--radius-lg:12px;
  --sidebar-w:240px;--header-h:64px;
}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.6}

/* ===== Login ===== */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#1a0a08 0%,#4a1810 50%,#1a0a08 100%);position:relative;overflow:hidden}
.login-wrap::before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 20% 30%,rgba(200,150,30,.15),transparent 50%),radial-gradient(circle at 80% 70%,rgba(184,51,37,.2),transparent 50%)}
.login-card{position:relative;width:420px;background:rgba(255,255,255,.97);border-radius:16px;box-shadow:var(--shadow-lg);padding:48px 40px}
.login-logo{text-align:center;margin-bottom:32px}
.login-logo .brand-icon{width:56px;height:56px;background:linear-gradient(135deg,var(--primary),var(--primary-dark));border-radius:14px;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-size:24px;font-weight:800;margin-bottom:16px}
.login-logo h1{font-size:20px;font-weight:700;color:var(--text);margin-bottom:4px}
.login-logo p{font-size:13px;color:var(--text-secondary)}
.login-form .form-group{margin-bottom:18px}
.login-form label{display:block;font-size:13px;font-weight:500;margin-bottom:8px}
.login-form input{width:100%;height:44px;padding:0 14px;border:1px solid var(--border);border-radius:var(--radius);font-size:14px;transition:.2s}
.login-form input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(184,51,37,.1)}
.login-form .submit-btn{width:100%;height:46px;background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff;border:none;border-radius:var(--radius);font-size:15px;font-weight:600;cursor:pointer;transition:.2s;margin-top:8px}
.login-form .submit-btn:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(184,51,37,.3)}
.login-error{color:var(--danger);font-size:13px;text-align:center;margin-top:12px;min-height:18px}
.login-tip{text-align:center;font-size:12px;color:var(--text-muted);margin-top:20px;padding-top:20px;border-top:1px solid var(--border-light)}

/* ===== Layout ===== */
.app{display:none}
.app.active{display:flex;min-height:100vh}
.sidebar{width:var(--sidebar-w);background:linear-gradient(180deg,#1a0f0d 0%,#2d1612 100%);color:#fff;position:fixed;top:0;left:0;bottom:0;z-index:100;display:flex;flex-direction:column}
.sidebar-brand{height:var(--header-h);display:flex;align-items:center;gap:12px;padding:0 20px;border-bottom:1px solid rgba(255,255,255,.08)}
.sidebar-brand .logo{width:36px;height:36px;background:linear-gradient(135deg,var(--primary),var(--accent));border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px}
.sidebar-brand h2{font-size:15px;font-weight:700;line-height:1.3}
.sidebar-brand h2 span{display:block;font-size:11px;color:var(--accent);font-weight:500;letter-spacing:.5px}
.sidebar-nav{flex:1;padding:16px 12px;overflow-y:auto}
.nav-group{margin-bottom:20px}
.nav-group-title{font-size:11px;color:rgba(255,255,255,.4);text-transform:uppercase;letter-spacing:1px;padding:8px 12px;font-weight:600}
.nav-item{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:8px;color:rgba(255,255,255,.7);cursor:pointer;transition:.2s;font-size:14px;margin-bottom:2px}
.nav-item:hover{background:rgba(255,255,255,.06);color:#fff}
.nav-item.active{background:linear-gradient(135deg,rgba(184,51,37,.8),rgba(184,51,37,.5));color:#fff;font-weight:500;box-shadow:0 4px 12px rgba(184,51,37,.3)}
.nav-item .icon{width:20px;height:20px;display:inline-flex;align-items:center;justify-content:center}
.nav-item .badge{margin-left:auto;background:var(--accent);color:#1a0f0d;font-size:11px;font-weight:700;padding:2px 7px;border-radius:10px}
.sidebar-footer{padding:16px;border-top:1px solid rgba(255,255,255,.08)}
.admin-info{display:flex;align-items:center;gap:12px;padding:10px;border-radius:8px;cursor:pointer;transition:.2s}
.admin-info:hover{background:rgba(255,255,255,.05)}
.admin-avatar{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent-dark));display:flex;align-items:center;justify-content:center;font-weight:700;color:#1a0f0d;font-size:14px}
.admin-text{flex:1;min-width:0}
.admin-text .name{font-size:13px;font-weight:600}
.admin-text .role{font-size:11px;color:rgba(255,255,255,.5)}
.logout-btn{margin-top:10px;width:100%;padding:8px;border:1px solid rgba(255,255,255,.15);background:transparent;color:rgba(255,255,255,.7);border-radius:8px;font-size:13px;cursor:pointer;transition:.2s}
.logout-btn:hover{background:rgba(255,255,255,.08);color:#fff}

/* Main */
.main{margin-left:var(--sidebar-w);flex:1;min-width:0;display:flex;flex-direction:column}
.header{height:var(--header-h);background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 32px;position:sticky;top:0;z-index:50}
.header h1{font-size:18px;font-weight:700;flex:1}
.header-actions{display:flex;gap:12px;align-items:center}
.content{padding:24px 32px;flex:1}

/* ===== Common ===== */
.btn{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 16px;border-radius:var(--radius);border:none;font-size:13px;font-weight:500;cursor:pointer;transition:.2s;white-space:nowrap}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-dark)}
.btn-secondary{background:var(--surface);color:var(--text);border:1px solid var(--border)}
.btn-secondary:hover{border-color:var(--primary);color:var(--primary)}
.btn-danger{background:#fef2f2;color:var(--danger);border:1px solid #fecaca}
.btn-danger:hover{background:var(--danger);color:#fff;border-color:var(--danger)}
.btn-success{background:#ecfdf5;color:#059669;border:1px solid #a7f3d0}
.btn-success:hover{background:#059669;color:#fff;border-color:#059669}
.btn-sm{height:30px;padding:0 10px;font-size:12px;border-radius:6px}
.btn-link{background:none;border:none;color:var(--primary);padding:0;height:auto;cursor:pointer;font-size:13px}
.btn-link:hover{text-decoration:underline}

.card{background:var(--surface);border-radius:var(--radius-lg);box-shadow:var(--shadow-sm);border:1px solid var(--border-light);overflow:hidden}
.card-header{display:flex;align-items:center;padding:20px 24px;border-bottom:1px solid var(--border-light)}
.card-header h3{font-size:16px;font-weight:600;flex:1}
.card-body{padding:24px}

/* Table */
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:var(--surface-2);padding:12px 16px;text-align:left;font-weight:600;color:var(--text-secondary);font-size:12px;text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid var(--border)}
td{padding:14px 16px;border-bottom:1px solid var(--border-light);vertical-align:middle}
tr:hover td{background:var(--surface-2)}
.td-actions{display:flex;gap:6px}

/* Tags */
.tag{display:inline-block;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:500}
.tag-success{background:#ecfdf5;color:#059669}
.tag-warning{background:#fffbeb;color:#d97706}
.tag-danger{background:#fef2f2;color:#dc2626}
.tag-info{background:#eff6ff;color:#2563eb}
.tag-default{background:#f3f4f6;color:#6b7280}
.tag-accent{background:#fef3c7;color:#b45309}

/* Pagination */
.pagination{display:flex;align-items:center;justify-content:space-between;padding:16px 24px;border-top:1px solid var(--border-light);font-size:13px;color:var(--text-secondary)}
.page-btns{display:flex;gap:6px}
.page-btn{width:32px;height:32px;border:1px solid var(--border);background:var(--surface);border-radius:6px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;font-size:13px;transition:.2s}
.page-btn:hover{border-color:var(--primary);color:var(--primary)}
.page-btn.active{background:var(--primary);color:#fff;border-color:var(--primary)}

/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:1000;padding:20px}
.modal-overlay.show{display:flex}
.modal{background:var(--surface);border-radius:var(--radius-lg);width:100%;max-width:720px;max-height:90vh;overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--shadow-lg)}
.modal.wide{max-width:900px}
.modal-header{padding:20px 24px;border-bottom:1px solid var(--border-light);display:flex;align-items:center}
.modal-header h3{font-size:16px;font-weight:600;flex:1}
.modal-close{width:32px;height:32px;border:none;background:transparent;cursor:pointer;font-size:20px;color:var(--text-secondary);border-radius:6px}
.modal-close:hover{background:var(--surface-2);color:var(--text)}
.modal-body{padding:24px;overflow-y:auto;flex:1}
.modal-footer{padding:16px 24px;border-top:1px solid var(--border-light);display:flex;justify-content:flex-end;gap:10px}

/* Tabs */
.tabs{display:flex;gap:0;border-bottom:2px solid var(--border-light);margin-bottom:20px}
.tab{padding:10px 20px;font-size:14px;font-weight:500;color:var(--text-secondary);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;transition:.2s}
.tab:hover{color:var(--text)}
.tab.active{color:var(--primary);border-bottom-color:var(--primary)}
.modal-tabs{display:flex;gap:0;border-bottom:2px solid var(--border-light);margin:-24px -24px 20px;padding:0 24px}
.modal-tab{padding:12px 16px;font-size:13px;font-weight:500;color:var(--text-secondary);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;transition:.2s}
.modal-tab:hover{color:var(--text)}
.modal-tab.active{color:var(--primary);border-bottom-color:var(--primary)}

/* Form */
.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.form-group{display:flex;flex-direction:column;gap:6px}
.form-group.full{grid-column:1/-1}
.form-group label{font-size:13px;font-weight:500;color:var(--text)}
.form-group label .req{color:var(--danger);margin-left:2px}
.form-group input,.form-group select,.form-group textarea{width:100%;height:38px;padding:0 12px;border:1px solid var(--border);border-radius:var(--radius);font-size:13px;background:var(--surface);transition:.2s;font-family:inherit}
.form-group textarea{height:auto;padding:10px 12px;resize:vertical;min-height:80px}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(184,51,37,.1)}
.form-group .hint{font-size:12px;color:var(--text-muted)}

/* Dynamic list */
.dyn-list{display:flex;flex-direction:column;gap:8px}
.dyn-item{display:flex;gap:8px;align-items:center}
.dyn-item input{flex:1;height:34px;padding:0 10px;border:1px solid var(--border);border-radius:6px;font-size:13px}
.dyn-item input.desc-input{flex:2}
.dyn-item .remove-btn{width:30px;height:30px;border:1px solid #fecaca;background:#fef2f2;color:var(--danger);border-radius:6px;cursor:pointer;flex-shrink:0;font-size:14px;display:flex;align-items:center;justify-content:center}
.dyn-add{margin-top:8px}
.dyn-add button{height:32px;padding:0 14px;border:1px dashed var(--border);background:var(--surface-2);border-radius:6px;cursor:pointer;font-size:12px;color:var(--text-secondary);display:inline-flex;align-items:center;gap:6px;transition:.2s}
.dyn-add button:hover{border-color:var(--primary);color:var(--primary)}

/* Config section */
.config-section{margin-bottom:24px}
.config-section:last-child{margin-bottom:0}
.config-section h4{font-size:14px;font-weight:600;margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid var(--border-light);display:flex;align-items:center;gap:8px}
.config-section h4::before{content:'';width:3px;height:14px;background:var(--primary);border-radius:2px}

/* Checkbox grid */
.checkbox-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.checkbox-grid label{display:flex;align-items:center;gap:8px;cursor:pointer;font-size:13px;font-weight:400;padding:8px 12px;border:1px solid var(--border);border-radius:8px;transition:.2s}
.checkbox-grid label:hover{border-color:var(--primary);background:rgba(184,51,37,.02)}
.checkbox-grid input[type="checkbox"]{width:16px;height:16px;accent-color:var(--primary)}

/* Judge chips */
.judge-chips{display:flex;flex-wrap:wrap;gap:8px}
.judge-chip{display:flex;align-items:center;gap:8px;padding:6px 12px;border:1px solid var(--border);border-radius:20px;font-size:12px;cursor:pointer;transition:.2s}
.judge-chip:hover{border-color:var(--primary)}
.judge-chip.selected{background:rgba(184,51,37,.08);border-color:var(--primary);color:var(--primary);font-weight:500}
.judge-chip .jc-avatar{width:22px;height:22px;border-radius:50%;background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600}

/* Stats */
.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px}
.stat-card{background:var(--surface);border:1px solid var(--border-light);border-radius:12px;padding:20px}
.stat-card .stat-num{font-size:28px;font-weight:700;color:var(--primary);margin-bottom:4px}
.stat-card .stat-label{font-size:13px;color:var(--text-secondary)}
.stat-card.gold .stat-num{color:var(--accent-dark)}
.stat-card.green .stat-num{color:var(--success)}
.stat-card.blue .stat-num{color:var(--info)}

/* Landing URL */
.landing-url-box{background:linear-gradient(135deg,rgba(200,150,30,.1),rgba(184,51,37,.08));border:1px solid rgba(200,150,30,.3);border-radius:10px;padding:16px 20px;display:flex;align-items:center;gap:14px}
.landing-url-box .url-icon{width:40px;height:40px;border-radius:10px;background:linear-gradient(135deg,var(--primary),var(--accent));display:flex;align-items:center;justify-content:center;color:#fff;font-size:20px;flex-shrink:0}
.landing-url-box .url-info{flex:1;min-width:0}
.landing-url-box .url-label{font-size:12px;color:var(--text-secondary);margin-bottom:2px}
.landing-url-box .url-text{font-family:monospace;font-size:13px;color:var(--primary);font-weight:600;word-break:break-all}
.landing-url-box .copy-btn{height:34px;padding:0 14px;background:var(--primary);color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:12px;font-weight:500;flex-shrink:0}

/* Dimension editor */
.dim-editor-item{display:grid;grid-template-columns:1fr 1.2fr 80px 36px;gap:10px;align-items:center;margin-bottom:8px}
.dim-editor-item input{height:34px;padding:0 10px;border:1px solid var(--border);border-radius:6px;font-size:13px}
.dim-editor-item .dim-del{width:30px;height:30px;border:1px solid #fecaca;background:#fef2f2;color:var(--danger);border-radius:6px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px}

/* Score items */
.score-item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--border-light)}
.score-item:last-child{border-bottom:none}
.score-item .dim-name{flex:1;font-size:13px}
.score-item .dim-name small{display:block;color:var(--text-muted);font-size:11px;margin-top:2px;font-weight:400}
.score-item .score-input{width:100px}
.score-item .score-input input{height:36px;text-align:center;font-size:15px;font-weight:600;color:var(--primary);width:100%}
.score-item .max-score{font-size:12px;color:var(--text-muted);width:50px;text-align:right}

/* Detail view */
.detail-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.detail-item{display:flex;flex-direction:column;gap:4px}
.detail-item.full{grid-column:1/-1}
.detail-item .label{font-size:12px;color:var(--text-secondary)}
.detail-item .value{font-size:14px;font-weight:500;word-break:break-word}

/* Cell avatar */
.cell-avatar{display:flex;align-items:center;gap:10px}
.cell-avatar .avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--primary),var(--primary-dark));display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:600;flex-shrink:0}
.cell-avatar .info{min-width:0}
.cell-avatar .name{font-weight:500;font-size:13px}
.cell-avatar .sub{font-size:12px;color:var(--text-secondary)}

/* Confirm */
.confirm-box{text-align:center;padding:10px 0}
.confirm-box .icon{width:56px;height:56px;border-radius:50%;background:#fef2f2;display:inline-flex;align-items:center;justify-content:center;font-size:28px;color:var(--danger);margin-bottom:16px}
.confirm-box h4{font-size:16px;margin-bottom:8px}
.confirm-box p{font-size:13px;color:var(--text-secondary)}

/* Responsive */
@media(max-width:1024px){
  .sidebar{transform:translateX(-100%);transition:.3s}
  .main{margin-left:0}
  .form-grid{grid-template-columns:1fr}
  .detail-grid{grid-template-columns:1fr}
  .stats-row{grid-template-columns:repeat(2,1fr)}
  .checkbox-grid{grid-template-columns:1fr}
}

</style>
</head>

<!-- ===== LOGIN PAGE ===== -->
<div class="login-wrap" id="loginPage">

</div>

<!-- ===== MAIN APP ===== -->
<div class="app" id="app">
  <aside class="sidebar">

      <div class="logo">A</div>

</div>

<!-- ===== MODAL ===== -->
<div class="modal-overlay" id="modalOverlay" onclick="if(event.target===this)closeModal()">
  <div class="modal wide" id="modalBox">
    <div class="modal-header">
      <h3 id="modalTitle">标题</h3>
      <button class="modal-close" onclick="closeModal()">×</button>

    <div class="modal-body" id="modalBody"></div>
    <div class="modal-footer" id="modalFooter"></div>

// ===== Utility =====
function genId(prefix){
  return prefix + Date.now().toString(36).toUpperCase() + Math.random().toString(36).substr(2,3).toUpperCase();
}
function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str || '';
  return div.innerHTML;
}
function statusTag(status){
  const map = {
    ongoing: ['进行中','tag-success'],
    ended: ['已结束','tag-default'],
    pending: ['待评审','tag-warning'],
    reviewing: ['评审中','tag-info'],
    scored: ['已评分','tag-success'],
    active: ['在职','tag-success'],
    inactive: ['停用','tag-default']
  };
  const [text, cls] = map[status] || [status, 'tag-default'];
  return `<span class="tag ${cls}">${text}</span>`;
}
function todayStr(){
  return new Date().toISOString().split('T')[0];
}

// ===== Modal =====
function openModal(title, bodyHtml, footerHtml, wide){
  document.getElementById('modalTitle').textContent = title;
  document.getElementById('modalBody').innerHTML = bodyHtml;
  document.getElementById('modalFooter').innerHTML = footerHtml;
  document.getElementById('modalBox').classList.toggle('wide', wide !== false);
  document.getElementById('modalOverlay').classList.add('show');
}
function closeModal(){
  document.getElementById('modalOverlay').classList.remove('show');
}
function confirmDialog(title, message, onConfirm){
  const body = `<div class="confirm-box">
    <div class="icon">!</div>
    <h4>${title}</h4>
    <p>${message}</p>
  </div>`;
  const footer = `
    <button class="btn btn-secondary" onclick="closeModal()">取消</button>
    <button class="btn btn-danger" id="confirmBtn">确认删除</button>
  `;
  openModal('确认操作', body, footer, false);
  setTimeout(() => {
    document.getElementById('confirmBtn').onclick = () => { closeModal(); onConfirm(); };
  }, 10);
}

// ===== Pagination =====
function renderPagination(total, totalPages, renderFn){
  const { page } = state.pagination;
  let pages = [];
  for(let i = 1; i <= totalPages; i++){
    if(i === 1 || i === totalPages || (i >= page-1 && i <= page+1)){
      pages.push(i);
    } else if(pages[pages.length-1] !== '...'){
      pages.push('...');
    }
  }
  return `
    <div class="pagination">
      <span>共 <strong>${total}</strong> 条记录</span>
      <div class="page-btns">
        <button class="page-btn" ${page<=1?'disabled style="opacity:.5;cursor:not-allowed"':''} onclick="state.pagination.page=Math.max(1,state.pagination.page-1);${renderFn}()">‹</button>
        ${pages.map(p => p === '...' 
          ? `<span style="padding:0 4px;color:var(--text-muted)">...</span>`
          : `<button class="page-btn ${p===page?'active':''}" onclick="state.pagination.page=${p};${renderFn}()">${p}</button>`
        ).join('')}
        <button class="page-btn" ${page>=totalPages?'disabled style="opacity:.5;cursor:not-allowed"':''} onclick="state.pagination.page=Math.min(${totalPages},state.pagination.page+1);${renderFn}()">›</button>
      </div>
    </div>
  `;
}

  state.compFormTab = 'basic';
  state._tempComp = data;
  state._tempCompId = id;
  
  renderCompetitionForm();
}

// Save form data before switching tabs
function saveTempForm(){
  const form = document.getElementById('compBasicForm');
  if(form){
    const fd = new FormData(form);
    state._tempComp.name = fd.get('name') || state._tempComp.name;
    state._tempComp.code = fd.get('code') || state._tempComp.code;
    state._tempComp.status = fd.get('status') || state._tempComp.status;
    state._tempComp.location = fd.get('location') || '';
    state._tempComp.signStart = fd.get('signStart') || '';
    state._tempComp.signEnd = fd.get('signEnd') || '';
    state._tempComp.submitEnd = fd.get('submitEnd') || '';
    state._tempComp.finalDate = fd.get('finalDate') || '';
    state._tempComp.description = fd.get('description') || '';
  }
}

// ---- Org dynamic items ----
function addOrgItem(type){
  state._tempComp.orgs[type].push('');
  renderCompetitionForm();
}
function updateOrgItem(el){
  const type = el.dataset.orgtype;
  const idx = parseInt(el.dataset.orgidx);
  state._tempComp.orgs[type][idx] = el.value;
}
function removeOrgItem(type, idx){
  state._tempComp.orgs[type].splice(idx, 1);
  renderCompetitionForm();
}

// ---- Group dynamic items ----
function addGroupItem(){
  state._tempComp.groups.push('');
  renderCompetitionForm();
}
function updateGroupItem(el){
  const idx = parseInt(el.dataset.grpidx);
  state._tempComp.groups[idx] = el.value;
}
function removeGroupItem(idx){
  state._tempComp.groups.splice(idx, 1);
  renderCompetitionForm();
}

// ---- Region dynamic items ----
function addRegionItem(){
  state._tempComp.regions.push('');
  renderCompetitionForm();
}
function updateRegionItem(el){
  const idx = parseInt(el.dataset.regidx);
  state._tempComp.regions[idx] = el.value;
}
function removeRegionItem(idx){
  state._tempComp.regions.splice(idx, 1);
  renderCompetitionForm();
}

// ---- Topic dynamic items ----
function addTopicItem(){
  state._tempComp.topics.push({ name: '', desc: '' });
  renderCompetitionForm();
}
function updateTopicItem(el){
  const idx = parseInt(el.dataset.topicidx);
  const key = el.dataset.topickey;
  state._tempComp.topics[idx][key] = el.value;
}
function removeTopicItem(idx){
  state._tempComp.topics.splice(idx, 1);
  renderCompetitionForm();
}

// ---- Judge assign ----
function toggleJudgeAssign(judgeId){
  const rc = state._tempComp.reviewConfig;
  const idx = rc.assignedJudges.indexOf(judgeId);
  if(idx > -1){
    rc.assignedJudges.splice(idx, 1);
  } else {
    rc.assignedJudges.push(judgeId);
  }
  renderCompetitionForm();
}

// ---- Score dimension dynamic items ----
function addDimItem(){
  state._tempComp.reviewConfig.scoreDimensions.push({ name: '', max: 20, desc: '' });
  renderCompetitionForm();
}
function updateDimItem(el){
  const idx = parseInt(el.dataset.dimidx);
  const key = el.dataset.dimkey;
  const val = key === 'max' ? (parseFloat(el.value) || 0) : el.value;
  state._tempComp.reviewConfig.scoreDimensions[idx][key] = val;
  // Update total
  const total = state._tempComp.reviewConfig.scoreDimensions.reduce((s,d)=>s+(d.max||0), 0);
  const totalEl = document.getElementById('dimTotal');
  if(totalEl) totalEl.textContent = total;
}
function removeDimItem(idx){
  if(state._tempComp.reviewConfig.scoreDimensions.length <= 1) return;
  state._tempComp.reviewConfig.scoreDimensions.splice(idx, 1);
  renderCompetitionForm();
}

function copyLandingUrl(){
  const url = state._tempComp.landingUrl;
  if(!url){ alert('暂未生成落地页链接，发布后自动生成'); return; }
  navigator.clipboard.writeText(url).then(() => alert('已复制到剪贴板'));
}

function saveCompetition(id){
  saveTempForm();
  const data = state._tempComp;
  
  // Validation
  if(!data.name || !data.code){
    alert('请填写赛事名称和编号');
    state.compFormTab = 'basic';
    renderCompetitionForm();
    return;
  }
  if(!data.signEnd || !data.submitEnd){
    alert('请设置报名和提交截止时间');
    state.compFormTab = 'basic';
    renderCompetitionForm();
    return;
  }
  
  const today = todayStr();
  if(data.signEnd < today){
    alert('报名截止时间不能早于当前日期');
    state.compFormTab = 'basic';
    renderCompetitionForm();
    return;
  }
  if(data.submitEnd < today){
    alert('提交截止时间不能早于当前日期');
    state.compFormTab = 'basic';
    renderCompetitionForm();
    return;
  }
  if(data.groups.length === 0 || data.groups.every(g => !g.trim())){
    alert('请至少添加一个竞赛组别');
    state.compFormTab = 'content';
    renderCompetitionForm();
    return;
  }
  if(data.regions.length === 0 || data.regions.every(r => !r.trim())){
    alert('请至少添加一个赛区');
    state.compFormTab = 'content';
    renderCompetitionForm();
    return;
  }
  
  // Clean up empty items
  data.groups = data.groups.filter(g => g.trim());
  data.regions = data.regions.filter(r => r.trim());
  data.topics = data.topics.filter(t => t.name.trim());
  
  // Generate landing URL if not exists (simulated)
  if(!data.landingUrl && data.code){
    data.landingUrl = `https://had2mhahdshad.github.io/aigc-wenchuang-2026/${data.code.toLowerCase()}/`;
  }
  
  if(id){
    const idx = state.competitions.findIndex(c => c.id === id);
    if(idx > -1) state.competitions[idx] = { ...state.competitions[idx], ...data };
  } else {
    state.competitions.unshift({
      id: genId('C'),
      ...data,
      createdAt: todayStr()
    });
  }
  
  closeModal();
  renderCompetitions();
}

function deleteCompetition(id){
  const c = state.competitions.find(x => x.id === id);
  confirmDialog('删除赛事', `确定要删除赛事「${c.name}」吗？删除后无法恢复。`, () => {
    state.competitions = state.competitions.filter(x => x.id !== id);
    renderCompetitions();
  });
}

function renderSubmissions(){
  const { search, status, group, region } = state.filters;
  const { page, pageSize } = state.pagination;
  
  let list = state.submissions;
  if(search){
    const s = search.toLowerCase();
    list = list.filter(w => w.title.toLowerCase().includes(s) || w.school.toLowerCase().includes(s) || w.id.toLowerCase().includes(s));
  }
  if(status) list = list.filter(w => w.status === status);
  if(group) list = list.filter(w => w.group === group);
  if(region) list = list.filter(w => w.region === region);
  
  const total = list.length;
  const totalPages = Math.max(1, Math.ceil(total / pageSize));
  const pageData = list.slice((page-1)*pageSize, page*pageSize);
  
  const groups = [...new Set(state.submissions.map(s => s.group))];
  const regions = [...new Set(state.submissions.map(s => s.region))];
  
  const html = `
    <div class="stats-row">
      <div class="stat-card">
        <div class="stat-num">${state.submissions.length}</div>
        <div class="stat-label">总作品数</div>
      </div>
      <div class="stat-card gold">
        <div class="stat-num">${state.submissions.filter(s=>s.status==='pending').length}</div>
        <div class="stat-label">待评审</div>
      </div>
      <div class="stat-card blue">
        <div class="stat-num">${state.submissions.filter(s=>s.status==='reviewing').length}</div>
        <div class="stat-label">评审中</div>
      </div>

function updateSubmissionComp(compId){
  const comp = state.competitions.find(c => c.id === compId);
  if(!comp) return;
  const gSel = document.getElementById('subGroupSelect');
  const rSel = document.getElementById('subRegionSelect');
  const tSel = document.getElementById('subTopicSelect');
  if(gSel) gSel.innerHTML = comp.groups.map(g => `<option value="${g}">${g}</option>`).join('');
  if(rSel) rSel.innerHTML = comp.regions.map(r => `<option value="${r}">${r}</option>`).join('');
  if(tSel) tSel.innerHTML = comp.topics.map(t => `<option value="${t.name}">${escapeHtml(t.name)}</option>`).join('');
}

function saveSubmission(id){
  const form = document.getElementById('subForm');
  const fd = new FormData(form);
  
  if(!fd.get('title') || !fd.get('school')){
    alert('请填写必填项');
    return;
  }
  
  const data = Object.fromEntries(fd.entries());
  
  if(id){
    const idx = state.submissions.findIndex(s => s.id === id);
    if(idx > -1) state.submissions[idx] = { ...state.submissions[idx], ...data };
  } else {
    state.submissions.unshift({
      id: genId('W'),
      ...data,
      score: null,
      submittedAt: new Date().toLocaleString('zh-CN', { hour12: false }).replace(/\//g,'-')
    });
  }
  
  closeModal();
  renderSubmissions();
  updateCounts();
}

function deleteSubmission(id){
  const w = state.submissions.find(x => x.id === id);
  confirmDialog('删除作品', `确定要删除作品「${w.title}」吗？删除后无法恢复。`, () => {
    state.submissions = state.submissions.filter(x => x.id !== id);
    state.reviews = state.reviews.filter(r => r.submissionId !== id);
    renderSubmissions();
    updateCounts();
  });
}

function switchJudgeTab(n){
  document.getElementById('jtab1').classList.toggle('active', n===1);
  document.getElementById('jtab2').classList.toggle('active', n===2);
  document.getElementById('jtabContent1').style.display = n===1 ? 'block' : 'none';
  document.getElementById('jtabContent2').style.display = n===2 ? 'block' : 'none';
}

function toggleVisibleField(key, checked){
  if(!state._tempJudge.visibleFields) state._tempJudge.visibleFields = [];
  if(checked){
    if(!state._tempJudge.visibleFields.includes(key)) state._tempJudge.visibleFields.push(key);
  } else {
    state._tempJudge.visibleFields = state._tempJudge.visibleFields.filter(f => f !== key);
  }
}

    alert('请填写姓名和单位');
    switchJudgeTab(1);
    return;
  }
  if(!username){
    alert('请设置登录账号');
    switchJudgeTab(2);
    return;
  }
  if(!password){
    alert('请设置登录密码');
    switchJudgeTab(2);
    return;
  }
  
  const data = {
    name: fd.get('name'),
    title: fd.get('title'),
    org: fd.get('org'),
    phone: fd.get('phone'),
    email: fd.get('email'),
    status: fd.get('status'),
    fields,
    username,
    password,
    visibleFields: state._tempJudge.visibleFields || []
  };
  
  if(id){
    const idx = state.judges.findIndex(j => j.id === id);
    if(idx > -1) state.judges[idx] = { ...state.judges[idx], ...data };
  } else {
    state.judges.unshift({
      id: genId('J'),
      ...data,
      createdAt: todayStr()
    });
  }
  
  closeModal();
  renderJudges();
}

// ===== 5. 作品评审 (Reviews) =====
// ========================================================
function renderReviews(){
  const { search, status } = state.filters;
  const { page, pageSize } = state.pagination;
  
  let list = state.submissions.map(s => {
    const reviews = state.reviews.filter(r => r.submissionId === s.id);
    const avgScore = reviews.length > 0
      ? (reviews.reduce((sum,r) => sum + r.total, 0) / reviews.length).toFixed(1)
      : null;
    return { ...s, reviewCount: reviews.length, avgScore };
  });
  
  if(search){
    const s = search.toLowerCase();
    list = list.filter(w => w.title.toLowerCase().includes(s) || w.school.toLowerCase().includes(s));
  }
  if(status){
    if(status === 'pending') list = list.filter(w => w.reviewCount === 0);
    else if(status === 'partial') list = list.filter(w => w.reviewCount > 0 && w.reviewCount < 3);
    else if(status === 'done') list = list.filter(w => w.reviewCount >= 3);
  }
  
  const total = list.length;
  const totalPages = Math.max(1, Math.ceil(total / pageSize));
  const pageData = list.slice((page-1)*pageSize, page*pageSize);
  
  const html = `
    <div class="card">
      <div class="card-header">
        <h3>作品评审</h3>
      </div>
      <div style="padding:16px 24px 0;display:flex;gap:12px;flex-wrap:wrap;align-items:center">
        <input type="text" placeholder="搜索作品/院校" value="${escapeHtml(search)}" oninput="state.filters.search=this.value;state.pagination.page=1;renderReviews()" style="height:36px;padding:0 12px;border:1px solid var(--border);border-radius:8px;font-size:13px;width:240px">
        <select onchange="state.filters.status=this.value;state.pagination.page=1;renderReviews()" style="height:36px;padding:0 12px;border:1px solid var(--border);border-radius:8px;font-size:13px">
          <option value="">全部状态</option>
          <option value="pending" ${status==='pending'?'selected':''}>未评审</option>
          <option value="partial" ${status==='partial'?'selected':''}>评审中</option>
          <option value="done" ${status==='done'?'selected':''}>评审完成</option>
        </select>
        <div style="flex:1"></div>
        <button class="btn btn-primary" onclick="showReviewForm()">+ 新增评分</button>
      </div>
      <div class="table-wrap" style="margin-top:16px">
        <table>
          <thead>
            <tr>
              <th>作品</th>
              <th>组别/赛区</th>
              <th>院校</th>
              <th>命题方向</th>
              <th>评审进度</th>
              <th>平均分</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody>
            ${pageData.map(w => {
              const progress = w.reviewCount >= 3 ? 'done' : w.reviewCount > 0 ? 'partial' : 'pending';
              const progressText = progress === 'done' ? '评审完成' : progress === 'partial' ? '评审中' : '未评审';
              const progressCls = progress === 'done' ? 'tag-success' : progress === 'partial' ? 'tag-info' : 'tag-warning';
              return `
              <tr>
                <td style="font-weight:500">
                  ${escapeHtml(w.title)}<br>
                  <span style="color:var(--text-secondary);font-size:12px;font-weight:400">${w.id}</span>
                </td>
                <td>${w.group}<br><span style="color:var(--text-secondary);font-size:12px">${w.region}</span></td>
                <td>${escapeHtml(w.school)}</td>
                <td><span class="tag tag-info">${escapeHtml(w.topic)}</span></td>
                <td>
                  <span class="tag ${progressCls}">${progressText}</span>
                  <div style="margin-top:6px;background:var(--border-light);height:4px;border-radius:4px;overflow:hidden;width:100px">
                    <div style="height:100%;background:var(--primary);width:${Math.min(w.reviewCount/3*100, 100)}%"></div>
                  </div>
                  <span style="font-size:11px;color:var(--text-muted)">${w.reviewCount}/3 位评委</span>
                </td>
                <td style="font-weight:700;font-size:16px;color:${w.avgScore?'var(--primary)':'var(--text-muted)'}">${w.avgScore || '-'}</td>
                <td>
                  <div class="td-actions">
                    <button class="btn btn-secondary btn-sm" onclick="viewReviews('${w.id}')">查看评审</button>
                    <button class="btn btn-primary btn-sm" onclick="showReviewForm('${w.id}')">打分</button>
                  </div>
                </td>
              </tr>
            `;}).join('')}
            ${pageData.length === 0 ? `<tr><td colspan="7" style="text-align:center;padding:40px;color:var(--text-muted)">暂无数据</td></tr>` : ''}
          </tbody>
        </table>
      </div>
      ${renderPagination(total, totalPages, 'renderReviews')}
    </div>
  `;
  document.getElementById('pageContent').innerHTML = html;
}

    { name: '基础设计维度', max: 30, desc: '主题契合度、创意性、视觉表现' },

      <div class="form-group full" style="margin-top:8px">
        <div style="background:var(--surface-2);border-radius:8px;padding:14px 16px">
          <div style="font-weight:600;margin-bottom:12px">评分维度</div>
          ${dims.map((d, i) => `
            <div class="score-item">

                <input type="number" name="score_${i}" min="0" max="${d.max}" step="0.5" value="0" data-max="${d.max}" oninput="updateReviewTotal()">

              <div class="max-score">/ ${d.max}</div>
            </div>

  const footer = `
    <button class="btn btn-secondary" onclick="closeModal()">取消</button>

function updateReviewTotal(){
  let total = 0;
  const dims = state._reviewDims || [];
  dims.forEach((d, i) => {
    const input = document.querySelector(`[name="score_${i}"]`);
    if(input) total += parseFloat(input.value) || 0;
  });
  const display = document.getElementById('reviewTotalDisplay');
  if(display) display.value = total.toFixed(1);
}

function saveReview(){
  const form = document.getElementById('reviewForm');
  const fd = new FormData(form);
  
  const submissionId = fd.get('submissionId');
  const judgeId = document.querySelector('[name="judgeId"]').value;
  const judge = state.judges.find(j => j.id === judgeId);
  const work = state.submissions.find(s => s.id === submissionId);
  
  const dims = state._reviewDims || [];
  const scores = {};
  let total = 0;
  dims.forEach((d, i) => {
    const val = parseFloat(fd.get(`score_${i}`)) || 0;
    // Map score keys
    const keyMap = ['designScore', 'aigcScore', 'presentationScore', 'extra1', 'extra2'];
    const key = keyMap[i] || `score${i}`;
    scores[key] = val;
    total += val;
  });
  
  if(!submissionId || !judgeId){ alert('请选择作品和评委'); return; }
  if(total <= 0){ alert('请填写评分'); return; }
  
  // Check if existing review
  const existingIdx = state.reviews.findIndex(r => r.submissionId === submissionId && r.judgeId === judgeId);
  
  const reviewData = {
    submissionId,
    judgeId,
    judgeName: judge?.name || '',
    competitionId: work?.competitionId || '',
    scores,
    total,
    comment: fd.get('comment') || '',
    reviewedAt: new Date().toLocaleString('zh-CN', { hour12: false }).replace(/\//g,'-')
  };
  
  if(existingIdx > -1){
    state.reviews[existingIdx] = { ...state.reviews[existingIdx], ...reviewData };
  } else {
    state.reviews.unshift({ id: genId('R'), ...reviewData });
  }
  
  // Update submission status
  const sub = state.submissions.find(s => s.id === submissionId);
  if(sub){
    const allReviews = state.reviews.filter(r => r.submissionId === submissionId);
    if(allReviews.length > 0){
      sub.status = allReviews.length >= 3 ? 'scored' : 'reviewing';
      sub.score = parseFloat((allReviews.reduce((s,r) => s + r.total, 0) / allReviews.length).toFixed(1));
    }
  }
  
  closeModal();
  renderReviews();
  updateCounts();
}

function viewReviews(submissionId){
  const work = state.submissions.find(s => s.id === submissionId);
  if(!work) return;
  
  const reviews = state.reviews.filter(r => r.submissionId === submissionId);
  const avgScore = reviews.length > 0
    ? (reviews.reduce((s,r) => s + r.total, 0) / reviews.length).toFixed(1)
    : null;
  
  const body = `
    <div style="margin-bottom:20px">
      <h3 style="font-size:16px;margin-bottom:4px">${escapeHtml(work.title)}</h3>
      <p style="color:var(--text-secondary);font-size:13px">${escapeHtml(work.school)} · ${work.group} · ${work.region}</p>
    </div>
    
    <div class="stats-row" style="grid-template-columns:repeat(3,1fr);margin-bottom:20px">
      <div class="stat-card">
        <div class="stat-num">${reviews.length}</div>
        <div class="stat-label">已评审评委数</div>
      </div>
      <div class="stat-card gold">
        <div class="stat-num">${avgScore || '-'}</div>
        <div class="stat-label">当前平均分</div>
      </div>
      <div class="stat-card green">
        <div class="stat-num">${work.status === 'scored' ? '已完成' : work.status === 'reviewing' ? '进行中' : '未开始'}</div>
        <div class="stat-label">评审状态</div>
      </div>
    </div>
    
    <div>
      <h4 style="font-size:14px;margin-bottom:12px">评审详情</h4>
      ${reviews.length === 0 ? '<p style="color:var(--text-muted);text-align:center;padding:30px">暂无评审记录</p>' : 
        reviews.map((r, i) => {
          const dimEntries = Object.entries(r.scores || {});
          return `
          <div style="border:1px solid var(--border-light);border-radius:8px;padding:16px;margin-bottom:12px">
            <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
              <div class="cell-avatar">
                <div class="avatar">${r.judgeName.charAt(0)}</div>
                <div class="info">
                  <div class="name">${escapeHtml(r.judgeName)}</div>
                  <div class="sub">${r.reviewedAt}</div>
                </div>
              </div>
              <div style="font-size:24px;font-weight:700;color:var(--primary)">${r.total.toFixed(1)}</div>
            </div>
            <div style="display:grid;grid-template-columns:repeat(${Math.min(dimEntries.length,3)},1fr);gap:10px;margin-bottom:12px">
              ${dimEntries.map(([k,v]) => `
                <div style="background:var(--surface-2);border-radius:6px;padding:8px 10px;text-align:center">
                  <div style="font-size:15px;font-weight:600;color:var(--primary)">${v}</div>
                  <div style="font-size:11px;color:var(--text-secondary)">${k.replace('Score','').replace('design','基础设计').replace('aigc','AIGC技术').replace('presentation','路演答辩')}</div>
                </div>
              `).join('')}
            </div>
            ${r.comment ? `<div style="font-size:13px;color:var(--text-secondary);padding-top:10px;border-top:1px solid var(--border-light)">💬 ${escapeHtml(r.comment)}</div>` : ''}
            <div style="text-align:right;margin-top:10px">
              <button class="btn btn-danger btn-sm" onclick="deleteReview('${r.id}','${submissionId}')">删除该评审</button>
            </div>
          </div>
        `;}).join('')
      }
    </div>
  `;
  
  const footer = `
    <button class="btn btn-secondary" onclick="closeModal()">关闭</button>
    <button class="btn btn-primary" onclick="closeModal();showReviewForm('${submissionId}')">继续评分</button>
  `;
  
  openModal('评审详情', body, footer, true);
}

function deleteReview(reviewId, submissionId){
  confirmDialog('删除评审', '确定要删除该评审记录吗？', () => {
    state.reviews = state.reviews.filter(r => r.id !== reviewId);
    // Update submission status
    const sub = state.submissions.find(s => s.id === submissionId);
    if(sub){
      const remaining = state.reviews.filter(r => r.submissionId === submissionId);
      if(remaining.length === 0){
        sub.status = 'pending';
        sub.score = null;
      } else {
        sub.status = remaining.length >= 3 ? 'scored' : 'reviewing';
        sub.score = parseFloat((remaining.reduce((s,r) => s + r.total, 0) / remaining.length).toFixed(1));
      }
    }
    closeModal();
    renderReviews();
    updateCounts();
  });
}

// ===== Init =====
window.onload = function(){
  if(sessionStorage.getItem('admin_logged_in') === '1'){
    showApp();
  }
};
</script>
