<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>赛事管理后台 - 登录</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{
    --primary:#c8362a;
    --primary-dark:#a02a20;
    --accent:#c8961e;
    --bg:#f5f5f0;
    --panel:#fff;
    --text:#1a1a1a;
    --muted:#6b6b6b;
    --border:#e5e0d5;
    --success:#2e7d32;
    --error:#c8362a;
  }
  body{
    font-family:"PingFang SC","Microsoft YaHei","Helvetica Neue",sans-serif;
    background:linear-gradient(135deg,#1a0a08 0%,#2d1810 50%,#1a0a08 100%);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    overflow:hidden;
  }
  body::before{
    content:'';position:absolute;top:-50%;left:-50%;width:200%;height:200%;
    background:radial-gradient(circle at 30% 40%,rgba(200,54,42,.08) 0%,transparent 40%),
               radial-gradient(circle at 70% 60%,rgba(200,150,30,.06) 0%,transparent 40%);
    animation:bgFloat 20s ease-in-out infinite;
  }
  @keyframes bgFloat{
    0%,100%{transform:translate(0,0)}
    50%{transform:translate(-2%,-1%)}
  }
  .login-wrap{
    position:relative;z-index:1;
    display:grid;
    grid-template-columns:1fr 1fr;
    width:900px;
    max-width:95vw;
    background:var(--panel);
    border-radius:20px;
    overflow:hidden;
    box-shadow:0 30px 80px rgba(0,0,0,.5);
  }
  .login-left{
    background:linear-gradient(160deg,var(--primary) 0%,var(--primary-dark) 100%);
    padding:60px 50px;
    color:#fff;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    position:relative;
  }
  .login-left::before{
    content:'';position:absolute;top:-80px;right:-80px;width:280px;height:280px;
    border-radius:50%;background:rgba(200,150,30,.15);
  }
  .login-left::after{
    content:'';position:absolute;bottom:-60px;left:-60px;width:200px;height:200px;
    border-radius:50%;background:rgba(255,255,255,.06);
  }
  .brand{
    position:relative;z-index:1;
  }
  .brand-logo{
    width:56px;height:56px;border-radius:14px;
    background:rgba(255,255,255,.15);
    backdrop-filter:blur(10px);
    display:flex;align-items:center;justify-content:center;
    font-size:28px;font-weight:900;
    border:1px solid rgba(255,255,255,.2);
    margin-bottom:24px;
    color:var(--accent);
  }
  .brand h1{
    font-size:26px;font-weight:700;margin-bottom:8px;
    letter-spacing:1px;
  }
  .brand p{
    font-size:14px;opacity:.8;line-height:1.7;
  }
  .login-footer{
    position:relative;z-index:1;
    font-size:12px;opacity:.6;
  }
  .login-right{
    padding:60px 50px;
    display:flex;flex-direction:column;justify-content:center;
  }
  .login-right h2{
    font-size:24px;font-weight:700;margin-bottom:8px;color:var(--text);
  }
  .login-right .sub{
    font-size:13px;color:var(--muted);margin-bottom:40px;
  }
  .form-group{
    margin-bottom:22px;
  }
  .form-group label{
    display:block;font-size:13px;font-weight:500;margin-bottom:8px;color:var(--text);
  }
  .input-wrap{
    position:relative;
  }
  .input-wrap svg{
    position:absolute;left:14px;top:50%;transform:translateY(-50%);
    width:18px;height:18px;color:var(--muted);
  }
  .input-wrap input{
    width:100%;
    padding:13px 16px 13px 44px;
    border:1.5px solid var(--border);
    border-radius:10px;
    font-size:14px;
    transition:.2s;
    outline:none;
    font-family:inherit;
    background:#fafaf7;
  }
  .input-wrap input:focus{
    border-color:var(--primary);
    background:#fff;
    box-shadow:0 0 0 3px rgba(200,54,42,.08);
  }
  .form-row{
    display:flex;justify-content:space-between;align-items:center;
    margin-bottom:28px;font-size:13px;
  }
  .remember{
    display:flex;align-items:center;gap:6px;cursor:pointer;color:var(--muted);
  }
  .remember input{
    accent-color:var(--primary);
  }
  .forgot{
    color:var(--primary);text-decoration:none;font-weight:500;
  }
  .btn-login{
    width:100%;
    padding:14px;
    background:linear-gradient(135deg,var(--primary),var(--primary-dark));
    color:#fff;
    border:none;
    border-radius:10px;
    font-size:15px;
    font-weight:600;
    cursor:pointer;
    transition:.2s;
    letter-spacing:2px;
  }
  .btn-login:hover{
    transform:translateY(-1px);
    box-shadow:0 8px 20px rgba(200,54,42,.3);
  }
  .btn-login:active{
    transform:translateY(0);
  }
  .error-msg{
    color:var(--error);
    font-size:13px;
    margin-top:10px;
    padding:10px 14px;
    background:rgba(200,54,42,.06);
    border-radius:8px;
    display:none;
  }
  .error-msg.show{display:block}
  @media(max-width:768px){
    .login-wrap{grid-template-columns:1fr;width:100%;max-width:420px}
    .login-left{display:none}
    .login-right{padding:50px 36px}
  }
</style>
</head>
<body>
  <div class="login-wrap">
    <div class="login-left">
      <div class="brand">
        <div class="brand-logo">AIGC</div>
        <h1>赛事管理系统</h1>
        <p>第二届 AIGC 文创设计赛项<br>统一管理平台</p>
      </div>
      <div class="login-footer">
        © 2026 一带一路暨金砖国家技能发展与技术创新大赛
      </div>
    </div>
    <div class="login-right">
      <h2>管理员登录</h2>
      <p class="sub">请输入您的账号密码进入管理后台</p>
      <form id="loginForm">
        <div class="form-group">
          <label>账号</label>
          <div class="input-wrap">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            <input type="text" id="username" placeholder="请输入账号" value="admin">
          </div>
        </div>
        <div class="form-group">
          <label>密码</label>
          <div class="input-wrap">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            <input type="password" id="password" placeholder="请输入密码" value="admin123">
          </div>
        </div>
        <div class="form-row">
          <label class="remember">
            <input type="checkbox" checked> 记住登录状态
          </label>
          <a href="#" class="forgot">忘记密码？</a>
        </div>
        <button type="submit" class="btn-login">登 录</button>
        <div class="error-msg" id="errorMsg">账号或密码错误</div>
      </form>
    </div>
  </div>

<script>
document.getElementById('loginForm').addEventListener('submit',function(e){
  e.preventDefault();
  const u=document.getElementById('username').value.trim();
  const p=document.getElementById('password').value.trim();
  const err=document.getElementById('errorMsg');
  if(u==='admin'&&p==='admin123'){
    sessionStorage.setItem('admin_logged','1');
    sessionStorage.setItem('admin_user',u);
    window.location.href='index.html';
  }else{
    err.textContent='账号或密码错误';
    err.classList.add('show');
  }
});
// 已登录直接跳转
if(sessionStorage.getItem('admin_logged')==='1'){
  window.location.href='index.html';
}
</script>
</body>
</html>
